; Presets do roteador do llama-server deste projeto (ver docs/servidor-opencode.md).
; Uso: numactl --interleave=all ./target/release/llama-server --models-preset models.ini --host 127.0.0.1 --port 8081
; Um modelo por vez (--models-max 1, o padrão): pedir o outro descarrega o atual.

[*]
gpu-layer-split = true

; MoE de 3B ativos: ~2x o decode do 27B em código (104/95/85/72 tok/s em 2k/8k/16k/30k) e
; prefill de 1250–1400 tok/s (2026-11-21). O KV é pequeno (só 10 camadas de atenção, 20 KiB por token): 128k cabem
; com ~10 GB por placa. Sem bloco MTP no arquivo.
[qwen3.8-35b-a3b]
model           = /home/murilo/llama.cpp/models/Qwen3.8-35B-A3B-Abliterated/Qwen3.8-35B-A3B-Distill.APEX-I-MiniPlus-V2.1-Abliterated.gguf
ctx-size        = 131072
load-on-startup = true

; MTP só especula abaixo de 12k de contexto (LLAMA_RS_MTP_ATE); acima disso o decode é simples.
[qwen3.8-27b]
model           = /run/media/murilo/BACKUP/MODELOS/Qwen3.8-27B-Q4_K_M.gguf
ctx-size        = 32768
mtp             = true
