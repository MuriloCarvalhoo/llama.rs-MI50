; Presets do roteador do llama-server deste projeto (ver docs/servidor-opencode.md).
; Uso: numactl --interleave=all ./target/release/llama-server --models-preset models.ini --host 127.0.0.1 --port 8081
; Um modelo por vez (--models-max 1, o padrão): pedir o outro descarrega o atual.

[*]
gpu-layer-split = true

; MoE de 3B ativos em Q5_K_M (i1, mradermacher, 23,6 GiB): o maior quant que cabe nas duas
; placas. 64k é o teto com 2 GiB de margem nas duas (monitor em repouso); 72k falta 68 MiB.
; O corte padrão (pela potência) estoura uma das placas: `split = 19` equilibra a VRAM.
; O bloco MTP do arquivo é MoE e fica de fora (só o MTP denso está implementado).
[qwen3.8-35b-a3b]
model           = /home/murilo/llama.cpp/models/Qwen3.8-35B-A3B-Distill-i1/Qwen3.8-35B-A3B-Distill.i1-Q5_K_M.gguf
ctx-size        = 65536
split           = 19
load-on-startup = true

; O de 3 bits abliterado (13,7 GiB): 128k cabem com ~10 GB por placa.
[qwen3.8-35b-a3b-q3]
model           = /home/murilo/llama.cpp/models/Qwen3.8-35B-A3B-Abliterated/Qwen3.8-35B-A3B-Distill.APEX-I-MiniPlus-V2.1-Abliterated.gguf
ctx-size        = 131072

; MTP só especula abaixo de 12k de contexto (LLAMA_RS_MTP_ATE); acima disso o decode é simples.
[qwen3.8-27b]
model           = /run/media/murilo/BACKUP/MODELOS/Qwen3.8-27B-Q4_K_M.gguf
ctx-size        = 32768
mtp             = true
